services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dnd_rag
      POSTGRES_PASSWORD: dnd_rag
      POSTGRES_DB: dnd_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  postgres_data:
