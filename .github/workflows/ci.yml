name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Readiness and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Deployment readiness
        run: scripts/check_deployment_readiness.sh

      - name: Cloudflare Function smoke
        run: node scripts/test_cloudflare_function.mjs

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Whitespace check
        run: git diff --check
